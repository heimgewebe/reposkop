[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reposkop"
version = "2.0.0"
description = "Canonical local checkout identity, transition and continuity truth for Heimgewebe."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.22"]

[project.scripts]
reposkop = "reposkop.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["reposkop", "reposkop.*"]

[tool.setuptools.package-data]
reposkop = ["schemas/*.json"]
